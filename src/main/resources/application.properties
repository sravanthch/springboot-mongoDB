## Production-friendly configuration: prefer environment variables
# MongoDB connection string (example: mongodb+srv://user:pass@host/db?retryWrites=true&w=majority)
spring.data.mongodb.uri=${MONGODB_URI:}
# Optional: explicitly set the database name (fallback to 'Task')
spring.data.mongodb.database=${MONGODB_DATABASE:Task}
# Port - Render and many PaaS set `PORT` automatically. Default to 8080 locally.
server.port=${PORT:8081}

# Recommended production settings
spring.main.allow-bean-definition-overriding=false
logging.level.root=INFO
management.endpoints.web.exposure.include=health,info
